name: Publicar S&S Solutions

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Bogota
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4
        with:
          ref: main   # siempre la última versión (evita repetir lo que otra corrida ya publicó)

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests pynacl

      - name: Publicar lo pendiente y vencido
        run: python Automatizacion/run_scheduled.py

      - name: Publicar videos en TikTok
        if: always()
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_SECRETS_PAT: ${{ secrets.GH_SECRETS_PAT }}
        run: python Automatizacion/tiktok_publish.py

      - name: Guardar el estado (solo schedule.json)
        if: always()
        run: |
          git config user.name "ss-publisher-bot"
          git config user.email "bot@ssolutions.local"
          git add Automatizacion/schedule.json
          git commit -m "auto: estado de publicaciones" || { echo "sin cambios que guardar"; exit 0; }
          git -c rebase.autoStash=true pull --rebase origin main || true
          git push || { git -c rebase.autoStash=true pull --rebase origin main; git push; }

      - name: Avisar si algo no se publico
        if: always()
        run: |
          if [ -s Automatizacion/errores_corrida.txt ]; then
            echo "::error::Hubo piezas que no se pudieron publicar"
            cat Automatizacion/errores_corrida.txt
            exit 1
          fi
