name: Publicar S&S Solutions

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Bogota
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Publicar lo pendiente y vencido
        run: python Automatizacion/run_scheduled.py

      - name: Guardar el estado (schedule + calendario)
        run: |
          git config user.name "ss-publisher-bot"
          git config user.email "bot@ssolutions.local"
          git add -A
          git commit -m "auto: estado de publicaciones" || echo "sin cambios que guardar"
          git push
