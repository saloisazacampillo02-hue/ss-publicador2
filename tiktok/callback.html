<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>S&amp;S Solutions · Conexión con TikTok</title>
<style>body{font-family:system-ui,sans-serif;background:#14213d;color:#f5efe0;max-width:640px;margin:40px auto;padding:0 16px}
h1{color:#d4af6a;font-weight:500}code{display:block;background:#0b1428;padding:12px;border-radius:8px;word-break:break-all;color:#fff}
button{margin-top:12px;background:#d4af6a;border:0;border-radius:20px;padding:10px 18px;font-size:15px;cursor:pointer}</style></head>
<body><h1>Conexión con TikTok</h1>
<p id="msg">Copia este código y pégalo en la ventana de Terminal donde corre <b>tiktok_tokens.py</b>.</p>
<code id="code">(sin código)</code><button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copiar código</button>
<script>
const q=new URLSearchParams(location.search);
if(q.get('code')){document.getElementById('code').textContent=q.get('code');}
else if(q.get('error')){document.getElementById('msg').textContent='TikTok no autorizó la conexión: '+q.get('error')+' '+(q.get('error_description')||'');}
</script></body></html>
